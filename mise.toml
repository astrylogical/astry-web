[tools]
bun = "1.4.1"
node = "24.18.1"
python = "3.13.11"
actionlint = "1.7.12"

[env]
TOOLS_ROOT = "{{ get_env(name='TOOLS_ROOT', default=config_root ~ '/.ci-tools') }}"
PYTHONDONTWRITEBYTECODE = "1"

[tasks.install]
run = "bun install --cwd app --frozen-lockfile"

[tasks.lint]
run = ["actionlint", "bun run --cwd app typecheck", "python3 .github/scripts/check-documentation.py"]

[tasks.build]
run = "bun run --cwd app build"

[tasks.artifact-check]
run = ["python3 \"$TOOLS_ROOT/helpers/site-contract.py\" app/dist --budget scripts/site-budget.json", "python3 scripts/check-assets.py"]

[tasks.test]
run = [{ task = "build" }, { task = "artifact-check" }]

[tasks.vuln]
run = "python3 \"$TOOLS_ROOT/helpers/audit.py\" app"

[tasks.check]
run = [{ task = "install" }, { task = "lint" }, { task = "test" }, { task = "vuln" }]

[tasks.dev]
run = "python3 \"$TOOLS_ROOT/helpers/dev.py\" run --state .local/dev --prepare '[\"bun\",\"install\",\"--cwd\",\"app\",\"--frozen-lockfile\"]' --policy-input mise.toml -- bun run --cwd app dev --host 127.0.0.1 --port 4321"

[tasks.stop]
run = "python3 \"$TOOLS_ROOT/helpers/dev.py\" stop --state .local/dev"

[tasks.clean]
run = "python3 \"$TOOLS_ROOT/helpers/clean.py\" --path app/dist --path app/.astro"
